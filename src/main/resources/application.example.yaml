spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: demo
  modulith:
    detection-strategy: explicitly-annotated
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/agent?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:your_db_user}
    password: ${MYSQL_PASSWORD:your_db_password}
    druid:
      max-active: 10
      initial-size: 1
      min-idle: 1
      max-wait: 60000
      test-on-borrow: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8000}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true
      force-request: true

app:
  # Python Agent Engine 的唯一 Java 边界。LLM、Memory、RAG、MCP、Skill、Tool 均由 Python 管理。
  graph:
    enabled: ${GRAPH_ENABLED:true}
    base-url: ${GRAPH_BASE_URL:http://127.0.0.1:8001}
    internal-token: ${GRAPH_INTERNAL_TOKEN:}
    connect-timeout-seconds: ${GRAPH_CONNECT_TIMEOUT_SECONDS:5}
    response-timeout-seconds: ${GRAPH_RESPONSE_TIMEOUT_SECONDS:120}

  email:
    listener:
      enabled: ${EMAIL_LISTENER_ENABLED:true}

  mail:
    smtp-host: ${SMTP_HOST:smtp.example.com}
    smtp-port: ${SMTP_PORT:465}
    smtp-username: ${SMTP_USERNAME:your_mail@example.com}
    smtp-password: ${SMTP_PASSWORD:your_smtp_password_or_app_password}
    smtp-ssl-enabled: ${SMTP_SSL_ENABLED:true}
    from-name: ${SMTP_FROM_NAME:Agent Demo}

  schedule:
    enabled: ${SCHEDULE_ENABLED:true}
    storage-path: ${SCHEDULE_STORAGE_PATH:./data/schedules}
    user-email: ${SCHEDULE_USER_EMAIL:your_mail@example.com}
    morning-reminder-cron: ${SCHEDULE_MORNING_REMINDER_CRON:"0 0 8 * * ?"}
    file-sort-cron: ${SCHEDULE_FILE_SORT_CRON:"0 0 19 * * ?"}

  task:
    scheduler:
      enabled: ${TASK_SCHEDULER_ENABLED:true}
      scan-interval-seconds: ${TASK_SCHEDULER_SCAN_INTERVAL_SECONDS:1}
      batch-size: ${TASK_SCHEDULER_BATCH_SIZE:50}
    executor:
      pool-size: ${TASK_EXECUTOR_POOL_SIZE:5}
      queue-capacity: ${TASK_EXECUTOR_QUEUE_CAPACITY:200}
      await-seconds: ${TASK_EXECUTOR_AWAIT_SECONDS:60}

  file:
    upload-dir: ${FILE_UPLOAD_DIR:./data/documents}
    allowed-types: ${FILE_ALLOWED_TYPES:txt,md,pdf,doc,docx}

  backup:
    directory: ${BACKUP_DIRECTORY:./data/backups}
    keep-most-recent: ${BACKUP_KEEP_MOST_RECENT:10}
    retention-days: ${BACKUP_RETENTION_DAYS:30}
    max-total-size-mb: ${BACKUP_MAX_TOTAL_SIZE_MB:0}
    file-name-prefix: ${BACKUP_FILE_NAME_PREFIX:agent-data-backup}

  security:
    issuer: ${SECURITY_ISSUER:agent-demo}
    jwt-secret: ${JWT_SECRET:replace_with_a_32_plus_byte_secret}
    data-secret: ${DATA_SECRET:replace_with_a_32_plus_byte_secret}
    access-token-minutes: ${SECURITY_ACCESS_TOKEN_MINUTES:120}
    refresh-token-days: ${SECURITY_REFRESH_TOKEN_DAYS:7}
    email-code-ttl-seconds: ${SECURITY_EMAIL_CODE_TTL_SECONDS:600}
    email-code-cooldown-seconds: ${SECURITY_EMAIL_CODE_COOLDOWN_SECONDS:120}
    github:
      enabled: ${GITHUB_OAUTH_ENABLED:false}
      client-id: ${GITHUB_CLIENT_ID:your_github_client_id}
      client-secret: ${GITHUB_CLIENT_SECRET:your_github_client_secret}
      authorize-uri: ${GITHUB_AUTHORIZE_URI:https://github.com/login/oauth/authorize}
      token-uri: ${GITHUB_TOKEN_URI:https://github.com/login/oauth/access_token}
      user-uri: ${GITHUB_USER_URI:https://api.github.com/user}
      emails-uri: ${GITHUB_EMAILS_URI:https://api.github.com/user/emails}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/oauth/github/callback}
      scope: ${GITHUB_SCOPE:"read:user user:email"}
      state-ttl-seconds: ${GITHUB_STATE_TTL_SECONDS:600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true
