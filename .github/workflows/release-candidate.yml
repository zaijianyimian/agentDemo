name: Publish 0.4 release candidate
on:
  push:
    branches: [release/0.4-rc.1]
permissions:
  contents: write
concurrency:
  group: release-0.4-rc.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build backend with example configuration
        run: |
          cp src/main/resources/application.example.yaml src/main/resources/application.yaml
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon
      - name: Package and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          git archive --format=zip --prefix=agentDemo/ HEAD > release-assets/agentDemo-0.4-rc.1-source.zip
          tar -czf release-assets/agentDemo-0.4-rc.1-frontend.tar.gz -C frontend dist
          cp build/libs/*-0.4.0-rc.1.jar release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..
          gh release create 0.4-rc.1 release-assets/* --target "$GITHUB_SHA" --prerelease --title '0.4-rc.1 候选版' --notes-file docs/release-0.4-rc.1.md
