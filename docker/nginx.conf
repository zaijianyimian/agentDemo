user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;

# 日志写到持久化目录，方便宿主机挂载后查看
error_log /app/runtime/nginx-logs/error.log warn;
access_log /app/runtime/nginx-logs/access.log;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    server_tokens off;

    proxy_cache_path /app/runtime/nginx-cache levels=1:2 keys_zone=app_cache:16m max_size=256m inactive=60m use_temp_path=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    upstream backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 8000 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /nginx-health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # 前端 SPA：fallback 到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源长缓存
        location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Spring Boot API + SSE 反代
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Actuator
        location /actuator/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # 上传/下载文件
        location /files/ {
            proxy_pass         http://backend;
        }
    }
}