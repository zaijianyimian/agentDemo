server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    server_tokens off;

    # Python Agent Engine 上游。Python 是独立容器，不能写 127.0.0.1：
    # 那样只会指向 nginx 所在容器自身。单机部署时改成本机地址即可。
    set $graph_upstream "graph:8001";

    # proxy_pass 使用变量时，nginx 不再在启动时解析域名，而是每次请求交给
    # resolver 解析；没有 resolver 会直接返回 502 "no resolver defined"。
    # 127.0.0.11 是 Docker 内置 DNS。非 Docker 部署请改成实际 DNS，例如
    # resolver 8.8.8.8 valid=10s;。valid=10s 让 graph 容器重建后能被重新发现。
    resolver 127.0.0.11 ipv6=off valid=10s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # AI 能力：/ai/* 转发到 Python。
    #
    # 路径改写规则：去掉 /ai 前缀并补上 /api，因此
    #   /ai/chat/turn  ->  http://graph:8001/api/chat/turn
    #   /ai/email/list ->  http://graph:8001/api/email/list
    # 与开发环境 Vite 代理的改写规则完全一致，行为不随环境变化。
    #
    # 这里必须用 rewrite 显式拼接路径，不能写成
    #   proxy_pass http://$graph_upstream/api/;
    # proxy_pass 一旦包含变量，其后的 URI 会被原样发给上游（"/api/"），
    # location 匹配到的剩余路径不会追加，所有 /ai/* 请求都会变成 /api/ 而 404。
    #
    # Python 自身的 /internal/* 不在此路径下，无法经由本入口访问：
    # /ai/internal/... 会被改写成 /api/internal/...，而 Python 未暴露该前缀。
    location /ai/ {
        rewrite ^/ai/(.*)$ /api/$1 break;
        proxy_pass http://$graph_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传浏览器 Authorization。Python 用它向 Java 内换取可信 user_id，
        # 因此该头绝不能在此剥离或覆盖。
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";

        # SSE/流式响应必须逐块透传，禁止 nginx 或上游压缩后聚合小块。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Accept-Encoding "";
        chunked_transfer_encoding on;
        # Agent 执行可能较长，读写超时需明显大于普通业务接口。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 客户端断开（用户点"停止生成"）时立即中断上游请求，
        # 否则 Agent 仍会继续生成并把半截回复写进历史。
        proxy_ignore_client_abort off;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache, no-transform" always;
    }

    # 同一容器内的 Spring Boot API。必须放在 SPA fallback 之前，
    # 否则 /api 请求会错误地返回 index.html，POST 则会得到 405。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE/流式响应必须逐块透传，禁止 nginx 或上游压缩后聚合小块。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Accept-Encoding "";
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache, no-transform" always;
    }

    # 前端 SPA: fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
