# AI 相关能力走 Python Graph 服务（8001），其余业务 API 走 Spring Boot（8000）。
# 用 map 集中决策上游，避免新增 AI 前缀时漏改某个 location。
# 注意：proxy_pass 使用变量且不带 URI 部分时，nginx 会原样透传请求 URI。
#
# 边界匹配说明：必须要求 AI 前缀之后紧跟 "/" 或字符串结束，否则
# /api/chats、/api/models、/api/search-config 之类的业务路径会被误判为 AI 接口
# 而被错误转发到 Python。(?=/|$) 提供这个边界，且不吞掉分隔符。
map $uri $api_upstream {
    default                                                                            http://backend:8000;
    ~^/api/(chat|knowledge|search|model|skill|markdown-skill|snippet|autonomy|report|mcp|chatimport)(?=/|$) http://graph:8001;
}

server {
    resolver 127.0.0.11 valid=10s ipv6=off;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # 裸 /api 与 /api/ 行为一致，避免开发环境代理到 Java、生产环境却回落到 SPA。
    location = /api {
        proxy_pass $api_upstream;
        include /etc/nginx/snippets/proxy_common.conf;
    }

    # 所有 /api/ 请求：上游由上面的 map 决定（AI → Python，其余 → Java）。
    # 必须放在 SPA fallback 之前，否则 /api 请求会错误地返回 index.html，POST 则会得到 405。
    location /api/ {
        proxy_pass $api_upstream;
        include /etc/nginx/snippets/proxy_common.conf;
    }

    # Python 内部接口只允许容器内网访问，绝不经反代暴露给浏览器。
    location /internal/ {
        return 404;
    }

    # 前端 SPA: fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
